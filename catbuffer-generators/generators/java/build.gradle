import java.time.Duration

plugins {
    id 'java'
    id 'signing'
    id "io.github.gradle-nexus.publish-plugin" version "2.0.0"
    id 'maven-publish'
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    testImplementation 'org.bouncycastle:bcprov-jdk15on:1.58'
    testImplementation group: 'org.yaml', name: 'snakeyaml', version: '1.27'
    testImplementation(platform("org.junit:junit-bom:5.4.0"))
    testImplementation("org.junit.jupiter:junit-jupiter:5.4.0")
}

tasks.register('install') {
    dependsOn publishToMavenLocal
    group = 'publishing'
    description = 'Alias for publishToMavenLocal'
}

def getPropertyValue(key, defaultValue = null) {
    def value = project.hasProperty(key) ? project[key] : System.getenv(key)
    return (value == null || value.trim() == '') ? defaultValue : value
}

def centralPortalUsername = getPropertyValue('centralPortalUsername')
def centralPortalPassword = getPropertyValue('centralPortalPassword')

def signingSecretKeyRingFile = getPropertyValue('signingSecretKeyRingFile')
def signingKeyId = getPropertyValue('signingKeyId')
def signingPassword = getPropertyValue('signingPassword')

def repoPath = getPropertyValue('TRAVIS_REPO_SLUG', "nemtech/catbuffer-generators")

allprojects {
    ext."signing.keyId" = signingKeyId
    ext."signing.secretKeyRingFile" = signingSecretKeyRingFile
    ext."signing.password" = signingPassword
}

test {
    useJUnitPlatform()
}

sourceCompatibility = '1.8'
targetCompatibility = '1.8'
version = '#artifactVersion'
description = 'catapult generated lib'
group 'io.nem'

task sourcesJar(type: Jar) {
    classifier = 'sources'
    from sourceSets.main.allSource
}

task javadocJar(type: Jar) {
    classifier = 'javadoc'
    from javadoc
}

artifacts {
    archives javadocJar, sourcesJar
}

signing {
    required { signingKeyId }
    sign publishing.publications
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact sourcesJar
            artifact javadocJar
            pom {
                url = "https://github.com/${repoPath}"
                groupId = 'io.nem'
                name = "${project.name}"
                description = "Generated lib in charge of buffering catapult transactions."
                scm {
                    connection = "scm:git:https://github.com/${repoPath}.git"
                    developerConnection = "scm:svn:https://github.com/${repoPath}"
                    url = "https://github.com/${repoPath}"
                }
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'fboucquez'
                        name = 'Fernando Boucquez'
                    }
                }
            }
        }
    }
}

if (centralPortalUsername) {
    nexusPublishing {
        packageGroup = "io.nem"
        repositories {
            sonatype {
                stagingProfileId = "io.nem"
                username = centralPortalUsername
                password = centralPortalPassword
                nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
                snapshotRepositoryUrl.set(uri("https://central.sonatype.com/repository/maven-snapshots/"))
            }
        }
        clientTimeout = Duration.ofSeconds(300)
        connectTimeout = Duration.ofSeconds(60)

        transitionCheckOptions {
            maxRetries.set(40)
            delayBetween.set(Duration.ofMillis(3000))
        }
    }
}
